# Tipos, tests E2E (con la API simulada, sin backend) y build en cada push y PR.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run check

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Informe de los tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
